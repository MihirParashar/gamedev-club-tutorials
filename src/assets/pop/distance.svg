<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19">
  <rect width="720" height="350" fill="#15132B"/>
  <line x1="350" y1="30" x2="350" y2="320" stroke="#322F52" stroke-width="2"/>

  <!-- hit: the click is closer to the center than the edge is -->
  <text x="175" y="52" fill="#F4EFE1" text-anchor="middle" font-weight="700">Hit</text>
  <circle cx="175" cy="185" r="90" fill="#FFD23F" fill-opacity="0.14" stroke="#FFD23F" stroke-width="3"/>
  <line x1="175" y1="185" x2="85" y2="185" stroke="#FFD23F" stroke-width="3"/>
  <text x="130" y="175" fill="#FFD23F" text-anchor="middle">r = 90</text>
  <line x1="175" y1="185" x2="223" y2="221" stroke="#F4EFE1" stroke-width="3"/>
  <circle cx="175" cy="185" r="5" fill="#FFD23F"/>
  <circle cx="223" cy="221" r="6" fill="#F4EFE1"/>
  <text x="212" y="250" fill="#F4EFE1" text-anchor="middle">click</text>
  <text x="175" y="318" fill="#F4EFE1" text-anchor="middle">distance 60 is less than r</text>

  <!-- miss: the click is further from the center than the edge is -->
  <text x="535" y="52" fill="#F4EFE1" text-anchor="middle" font-weight="700">Miss</text>
  <circle cx="500" cy="195" r="90" fill="#FFD23F" fill-opacity="0.14" stroke="#FFD23F" stroke-width="3"/>
  <line x1="500" y1="195" x2="410" y2="195" stroke="#FFD23F" stroke-width="3"/>
  <text x="455" y="185" fill="#FFD23F" text-anchor="middle">r = 90</text>
  <line x1="500" y1="195" x2="620" y2="195" stroke="#F4EFE1" stroke-width="2" stroke-dasharray="8 7"/>
  <line x1="620" y1="195" x2="620" y2="105" stroke="#F4EFE1" stroke-width="2" stroke-dasharray="8 7"/>
  <line x1="500" y1="195" x2="620" y2="105" stroke="#F4EFE1" stroke-width="3"/>
  <circle cx="500" cy="195" r="5" fill="#FFD23F"/>
  <circle cx="620" cy="105" r="6" fill="#F4EFE1"/>
  <text x="620" y="88" fill="#F4EFE1" text-anchor="middle">click</text>
  <text x="552" y="222" fill="#F4EFE1" text-anchor="middle">120 across</text>
  <text x="632" y="158" fill="#F4EFE1">90 up</text>
  <text x="545" y="140" fill="#F4EFE1" text-anchor="end" font-weight="700">150</text>
  <text x="535" y="318" fill="#F4EFE1" text-anchor="middle">distance 150 is more than r</text>
</svg>
