<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19">
  <rect width="720" height="330" fill="#15132B"/>
  <line x1="360" y1="30" x2="360" y2="300" stroke="#322F52" stroke-width="2"/>

  <!-- no hit: the drop is beside the player -->
  <text x="180" y="52" fill="#F4EFE1" text-anchor="middle" font-weight="700">No hit</text>
  <rect x="140" y="130" width="66" height="100" fill="#FFD23F"/>
  <rect x="228" y="96" width="20" height="40" fill="#F4EFE1"/>
  <text x="180" y="282" fill="#F4EFE1" text-anchor="middle">collidelist returns -1</text>

  <!-- hit: the drop overlaps the player -->
  <text x="540" y="52" fill="#F4EFE1" text-anchor="middle" font-weight="700">Hit</text>
  <rect x="507" y="130" width="66" height="100" fill="#FFD23F"/>
  <rect x="530" y="104" width="20" height="40" fill="#F4EFE1" stroke="#15132B" stroke-width="2"/>
  <text x="540" y="282" fill="#F4EFE1" text-anchor="middle">collidelist returns 0 or more</text>
</svg>
