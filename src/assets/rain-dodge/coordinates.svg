<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19">
  <rect width="720" height="500" fill="#15132B"/>
  <!-- the game window -->
  <rect x="110" y="70" width="520" height="390" fill="none" stroke="#F4EFE1" stroke-width="2"/>
  <text x="110" y="52" fill="#F4EFE1">(0, 0)</text>
  <text x="630" y="488" fill="#F4EFE1" text-anchor="end">(800, 600)</text>

  <!-- x axis -->
  <line x1="126" y1="86" x2="270" y2="86" stroke="#FFD23F" stroke-width="4"/>
  <path d="M270 76 L290 86 L270 96 Z" fill="#FFD23F"/>
  <text x="150" y="116" fill="#FFD23F" font-weight="700">x grows right</text>

  <!-- y axis -->
  <line x1="126" y1="86" x2="126" y2="250" stroke="#FFD23F" stroke-width="4"/>
  <path d="M116 250 L126 270 L136 250 Z" fill="#FFD23F"/>
  <text x="146" y="216" fill="#FFD23F" font-weight="700">y grows down</text>

  <!-- the player and the two distances that place it -->
  <rect x="430" y="395" width="43" height="65" fill="#FFD23F"/>
  <line x1="430" y1="70" x2="430" y2="395" stroke="#F4EFE1" stroke-width="2" stroke-dasharray="8 7"/>
  <line x1="110" y1="395" x2="430" y2="395" stroke="#F4EFE1" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="270" y="385" fill="#F4EFE1" text-anchor="middle">player.x</text>
  <text x="442" y="238" fill="#F4EFE1">player.y</text>
  <text x="485" y="434" fill="#F4EFE1">player</text>
</svg>
