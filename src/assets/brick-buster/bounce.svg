<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19">
  <rect width="720" height="400" fill="#15132B"/>
  <line x1="360" y1="30" x2="360" y2="370" stroke="#322F52" stroke-width="2"/>

  <!-- one frame: dx across, dy up, and where the ball ends up -->
  <text x="180" y="46" fill="#F4EFE1" text-anchor="middle" font-weight="700">One frame</text>
  <line x1="100" y1="290" x2="172" y2="290" stroke="#F4EFE1" stroke-width="3"/>
  <path d="M172 281 L190 290 L172 299 Z" fill="#F4EFE1"/>
  <line x1="190" y1="290" x2="190" y2="170" stroke="#F4EFE1" stroke-width="3"/>
  <path d="M181 170 L190 152 L199 170 Z" fill="#F4EFE1"/>
  <line x1="100" y1="290" x2="183" y2="152" stroke="#FFD23F" stroke-width="3" stroke-dasharray="8 7"/>
  <circle cx="100" cy="290" r="11" fill="#FFD23F"/>
  <circle cx="190" cy="140" r="11" fill="none" stroke="#FFD23F" stroke-width="3"/>
  <text x="145" y="322" fill="#F4EFE1" text-anchor="middle">dx = 3</text>
  <text x="208" y="226" fill="#F4EFE1">dy = -5</text>
  <text x="180" y="372" fill="#FFD23F" text-anchor="middle" font-weight="700">3 right and 5 up</text>

  <!-- a bounce off the right wall: dx flips, dy does not -->
  <text x="540" y="46" fill="#F4EFE1" text-anchor="middle" font-weight="700">Hitting the right wall</text>
  <line x1="672" y1="70" x2="672" y2="340" stroke="#F4EFE1" stroke-width="4"/>
  <line x1="570" y1="325" x2="660" y2="175" stroke="#FFD23F" stroke-width="4"/>
  <path d="M624 235 L622.4 255 L607 245.8 Z" fill="#FFD23F"/>
  <line x1="660" y1="175" x2="609" y2="90" stroke="#FFD23F" stroke-width="4"/>
  <path d="M600 75 L617 85.8 L601.6 95 Z" fill="#FFD23F"/>
  <circle cx="660" cy="175" r="11" fill="#FFD23F"/>
  <text x="552" y="268" fill="#F4EFE1" text-anchor="end">before</text>
  <text x="552" y="294" fill="#F4EFE1" text-anchor="end">dx = 3, dy = -5</text>
  <text x="590" y="118" fill="#F4EFE1" text-anchor="end">after</text>
  <text x="590" y="144" fill="#F4EFE1" text-anchor="end">dx = -3, dy = -5</text>
  <text x="540" y="372" fill="#FFD23F" text-anchor="middle" font-weight="700">dx flips, dy stays</text>
</svg>
